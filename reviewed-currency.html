<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reviewed foreign currency corrections · Oon Jai Accounting</title>
<style>body{margin:2rem auto;max-width:70rem;padding:0 16px;color:#123e30;background:#faf8f1;font:16px/1.5 system-ui}button,a{font:inherit}button{padding:.5rem .8rem;margin:0 .6rem .6rem 0}table{border-collapse:collapse}td,th{padding:5px 12px;text-align:left;border-bottom:1px solid #b7c4ba}details{margin-top:.4rem}pre{white-space:pre-wrap}button[hidden]{display:none}</style>
<script src="deployment-config.js?v=143.109"></script><script src="scripts/supabase-config.js?v=143.109"></script><script src="assets/vendor/noble-gcm14334.js?v=143.34"></script><script src="scripts/device-vault14334.js?v=143.212"></script><script src="assets/vendor/supabase.js?v=142.47"></script></head>
<body><h1>Original-month currency valuations</h1><p>Review the prepared journal revisions against their original accounting months.</p><p id="status" role="status">Opening the Accounting session…</p><button id="review" disabled>Review February–September</button><button id="apply" hidden>Apply reviewed corrections</button><div id="details"></div><p><a href="index.html">Open Accounting</a></p>
<script>
'use strict';
(async()=>{
 const status=document.getElementById('status'),review=document.getElementById('review'),apply=document.getElementById('apply'),details=document.getElementById('details');
 let db,receipt;
 const show=m=>status.textContent=m;
 async function rpc(name,params){if(!deviceVault14334.unlocked||!navigator.onLine)throw Error('Open Accounting and sign in online in this tab.');const result=await db.rpc(name,params);if(result.error)throw Error(result.error.message);return result.data;}
 try{await deviceVault14334.ready;db=supabase.createClient(OJM_SUPABASE_URL,OJM_SUPABASE_ANON_KEY,{auth:{autoRefreshToken:false,detectSessionInUrl:false}});await deviceVault14334.attach(db);
 const own=await db.auth.getUser();if(own.error||!own.data.user||!deviceVault14334.unlocked||deviceVault14334.actor!==own.data.user.id)throw Error('Open Accounting and sign in in this tab.');
 review.disabled=false;show('Ready to review.');}catch(e){show(e.message);return;}
 review.onclick=async()=>{review.disabled=true;apply.hidden=true;details.replaceChildren();let count=0;
 try{for(let m=2;m<=9;m++){const day='2026-'+String(m).padStart(2,'0')+'-01';show('Checking '+day.slice(0,7)+'…');
 const d=await rpc('review_fx_originals294',{p_month:day});const section=document.createElement('details'),head=document.createElement('summary'),body=document.createElement('pre');
 count+=(d.entries||[]).length;head.textContent=day.slice(0,7)+' · '+(d.entries||[]).join(', ')+' · '+d.issues.length+' review items';
 body.textContent=JSON.stringify({issues:d.issues,cash:d.cash,pending:d.pending},null,2);section.append(head,body);details.append(section);}
 show(count+' original journal revisions available.');apply.hidden=count!==16;
 }catch(e){show(e.message);}finally{review.disabled=false;}};
 apply.onclick=async()=>{if(receipt)return;review.disabled=apply.disabled=true;show('Verifying the reviewed journals and source balances…');
 try{receipt=await rpc('apply_fx_originals294',{});show(receipt.message||'Correction saved.');const p=document.createElement('pre');p.textContent=JSON.stringify(receipt,null,2);details.prepend(p);apply.hidden=true;}catch(e){show(e.message);apply.disabled=false;}finally{review.disabled=false;}};
})();
</script></body></html>
