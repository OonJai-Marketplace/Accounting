<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review prepaid accounts · Oon Jai Accounting</title>
<style>body{font:16px/1.5 system-ui;color:#203b32;background:#faf8f2;margin:2rem auto;max-width:52rem;padding:0 1rem}button{font:inherit;background:#145440;color:white;padding:.55rem .9rem;border:0;border-radius:5px}button:disabled{opacity:.5}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:.45rem;border-bottom:1px solid #c4d0c7}#result{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#14634e}</style>
<script src="deployment-config.js?v=143.109"></script><script src="scripts/supabase-config.js?v=143.109"></script><script src="assets/vendor/noble-gcm14334.js?v=143.34"></script><script src="scripts/device-vault14334.js?v=143.212"></script><script src="assets/vendor/supabase.js?v=142.47"></script></head>
<body><h1>Prepaid account review</h1><p id="status" role="status">Opening the Accounting session…</p><button id="check" disabled>Review accounts and releases</button><section id="details" hidden><h2>October releases</h2><table><thead><tr><th>Posting date</th><th>Current journal ID</th><th>Status</th></tr></thead><tbody id="journals"></tbody></table><h2>Expense accounts and remaining schedules</h2><ul id="changes"></ul><button id="apply" disabled>Apply reviewed corrections</button></section><div id="result"></div><p><a href="index.html">Open Accounting</a></p>
<script>
(async()=>{const el=id=>document.getElementById(id),show=s=>el('status').textContent=s;let db,review,actor,busy=false;
const fmt=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
async function rpc(name,args){if(!deviceVault14334.unlocked||!navigator.onLine||deviceVault14334.actor!==actor)throw Error('Reconnect and unlock the Accounting session.');const r=await db.rpc(name,args);if(r.error)throw Error(r.error.message);return r.data}
try{await deviceVault14334.ready;db=supabase.createClient(OJM_SUPABASE_URL,OJM_SUPABASE_ANON_KEY,{auth:{autoRefreshToken:false,detectSessionInUrl:false}});await deviceVault14334.attach(db);const own=await db.auth.getUser();if(own.error||!own.data.user||!deviceVault14334.unlocked||deviceVault14334.actor!==own.data.user.id)throw Error('Open Accounting and sign in in this tab.');actor=own.data.user.id;el('check').disabled=false;show('Ready to review.')}catch(e){show(e.message);return}
el('check').onclick=async()=>{if(busy)return;busy=true;el('check').disabled=true;el('apply').disabled=true;el('details').hidden=true;show('Checking the posted journals and account balances…');try{review=await rpc('prepaid_review298',{});el('journals').replaceChildren();for(const r of review.records){const tr=el('journals').insertRow();for(const v of [r.date,r.number,r.status])tr.insertCell().textContent=v}
el('changes').replaceChildren();const lines=[review.house_expense+' under Company. Reclassify the existing ₭'+fmt(review.catch_up)+' October catch-up to this account.',review.restaurant_expense+' under Restaurant. Separate the company house prepayment and its USD mapping from the restaurant accounts.','House rent: four monthly releases of ₭'+fmt(review.house_per_month)+'. Wi-Fi: five monthly releases of ₭'+fmt(review.wifi_per_month)+'. The schedules require approval before posting.','Assign separate AMO numbers to the three October releases, retain their earlier IDs for tracing, and keep the original prepayment IDs.'];
for(const line of lines){const li=document.createElement('li');li.textContent=line;el('changes').append(li)}el('details').hidden=false;el('apply').disabled=review.period!=='open';show('Review complete. October is '+review.period+'.')}catch(e){show(e.message)}finally{busy=false;el('check').disabled=false}};
el('apply').onclick=async()=>{if(busy||!review)return;busy=true;el('apply').disabled=true;el('check').disabled=true;show('Applying the reviewed corrections…');try{const receipt=await rpc('apply_prepaid_review298',{p_fingerprint:review.fingerprint});el('result').textContent=JSON.stringify(receipt,null,2);el('apply').hidden=true;show('Account, schedule and journal corrections saved.')}catch(e){show(e.message);el('check').disabled=false}finally{busy=false}};
})();
</script></body></html>
