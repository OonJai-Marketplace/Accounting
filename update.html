<style>html{background:#f4f5ed}body{margin:0;background:#f4f5ed;color:#174c3b;font:16px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{max-width:440px;margin:24px;padding:28px;background:#fffdf7;border:1px solid #bdcdb7;border-radius:12px}h1{font-size:23px;margin-top:0}progress{width:100%;accent-color:#176249}button{font:inherit;background:#176249;color:white;border:0;border-radius:6px;padding:8px 14px}small{color:#53665a}#updateNotes{max-height:35vh;overflow-y:auto;margin-top:20px;border-top:1px solid #bdcdb7;padding-top:12px}#updateNotes h2{font-size:16px;margin:0 0 8px}#updateNotes ul{padding-left:20px;font-size:14px}#updateNotes li{margin:6px 0}</style></head>
<body><main><h1>Updating Accounting</h1><p id="updateStatus" role="status">Preparing the latest version…</p><progress id="updateProgress" max="1" aria-label="Website update progress"></progress><button id="updateRetry" type="button" hidden>Retry update</button><section id="updateNotes" hidden aria-label="Release changes"></section><noscript>Enable JavaScript to update Accounting.</noscript></main><script type="application/json" id="updateRelease">{"version":"143.501","changes":["Accounting shows a progress bar while the workspace files open after an update, before the usual sign-in animation and preparation steps.","Full PDF opens in a centered receipt window. The PDF fills the space below its toolbar, with the accounting screen visible around it. If Drive cannot open the receipt folder, Accounting keeps the last successful file list.","Accounting remembers receipt pages on this device between administrator sign-ins. Recent pages load first, and later checks download missing or changed images.","The receipt link is centered below the entry ID in journal and ledger tables so it stays inside the column.","Full PDF opens linked receipts across the screen, with the original PDF link and Close PDF at the top.","After an update is found, Download update starts loading the website files immediately on phones and desktops.","The administrator receipt bell names files that need attention and explains how to fix them. On iPad, a receipt bell appears in the sidebar when there is a problem.","Click a journal entry ID to open its linked receipt. Drive receipts keep one private preview per page. Overlapping uploads wait for review.","On phones, Scan now shows “Feature unavailable. Coming soon.”","Report signatories use a responsive name and job title layout. Fund utilization gives more room to item descriptions and removes the payroll adjustment action. Documents adds year, status and classification filters, compact creation actions and automatic offline number preparation.","General Ledger and Trial Balance retain all prepared rows. Comparative Trial Balance shows a quarter or year, with category bands, indented accounts and content-sized columns.","Accounting rechecks an interrupted database connection when a laptop wakes. Device storage measurement is available on demand, and desktop updates reuse cached files with fewer storage lookups.","HR Leave supports per-employee leave grants with expiry and approved extensions of unused vacation from completed service years.","Payroll uses approved daily leave and verifies that leave is current at close. Backup & Recovery can manually refresh and verify both company Google archives.","Older payroll journal templates now recognize retired salary mapping accounts and use their approved active replacements.","Prepared and direct payroll journals use the same saved payroll valuation. A separate book rate remains editable, and restoring a payroll draft preserves explicit rates.","Overtime preserves approved unpaid leave. Payroll inputs are locked during finalization.","Phone sync continues with independent valid entries when a receipt needs correction.","Approved reports preserve unfinished journals. Budget finalization checks remaining funding per currency.","Trial Balance filters are independent from the floating Account Balances shortcut, including account selections and column settings.","Monthly Comparative Trial Balance displays readable account names and headings. Its Columns choice sits beside Report type.","Edit accounts remains only in the floating Account Balances shortcut. Trial Balance includes all accounts matching its own currency filter.","Linked utilization reports show View journal to review their original recorded entry without creating a new transaction.","Journal Templates includes Owner support from fund utilization with a saved-report picker.","Owner-support receipt, usage and staff-deposit templates select the regular Remaining and Used equity accounts in USD, LAK and THB; bank and staff choices remain editable.","Support allocations retain equal original contribution rates and existing template numbers.","Utilization reports keep one funding summary. A single receipt no longer repeats Total received; multiple receipts retain their currency totals.","Removed the Cash movements section and automatic explanatory paragraphs. Available after exchange, Total used, Remaining funding and references remain.","Only optional Additional information is printed. Historical record notes remain saved, with financial amounts and journal IDs unchanged.","Account Balances remembers measured widths on this device; refresh and reopening reuse them without measuring the same columns again."]}</script><script defer src="scripts/update14390.js?v=143.501"></script></body></html>
