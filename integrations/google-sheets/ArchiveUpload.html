<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
body{font:14px/1.5 system-ui,sans-serif;margin:18px;color:#20382f}input,button{display:block;margin:12px 0;max-width:100%}button{background:#166344;color:white;border:0;border-radius:5px;padding:9px 14px}button:disabled{opacity:.55}output{display:block}
</style></head><body><form id="upload">
<label>Accounting Excel or JSON file<input name="archive" type="file" accept=".xlsx,.json" required></label>
<p>Choose the original file downloaded from Backup &amp; Recovery. New records and changed versions are appended to Source Records. Repeat uploads skip identical versions.</p>
<button>Append to Source Records</button></form><output role="status"></output>
<script>
const form=document.querySelector('form'),button=form.querySelector('button'),status=document.querySelector('output');
form.onsubmit=e=>{e.preventDefault();button.disabled=true;status.textContent='Reading file and checking existing records…';
google.script.run.withSuccessHandler(message=>{status.textContent=message;button.disabled=false;})
.withFailureHandler(error=>{status.textContent=error.message;button.disabled=false;}).uploadAccountingFile(form);};
</script></body></html>
