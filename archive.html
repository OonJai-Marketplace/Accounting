<body><div class="layout"><aside class="sidebar"><div class="brand"><span class="mark">OJ</span><div><strong>Oon Jai</strong><small>AUDIT WORKSPACE</small></div></div><nav id="navigation" aria-label="Audit sections"></nav><div class="sidebar-foot">Separate working copy<br><small>Local edits · No database connection</small></div></aside>
<main class="main"><header class="top"><button id="menu" class="mobile-menu" type="button" aria-label="Toggle audit menu">☰</button><div><span class="eyebrow">LOCAL AUDIT COPY</span><h1 id="heading">Open audit data</h1></div><label class="file-button">Load data file<input id="archiveFile" type="file" accept="application/json,.json"></label></header>
