<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>November 13 accounting recovery</title><style>body{font:16px/1.5 system-ui,sans-serif;color:#173c34;background:#f6f7f2;margin:0}main{max-width:40rem;margin:8vh auto;padding:2rem;background:white;border:1px solid #d3dfd9;border-radius:12px}h1{font-size:1.65rem}button{font:inherit;color:white;background:#175b4c;border:0;border-radius:6px;padding:.6rem 1rem;margin:.25rem .3rem .25rem 0;cursor:pointer}button:disabled{opacity:.45}li{margin:.35rem 0}a{color:#175b4c}</style>
<script src="deployment-config.js"></script><script src="scripts/supabase-config.js"></script><script src="assets/vendor/supabase.js"></script></head>
<body><main><h1>November 13 accounting recovery</h1><p id="session" role="status">Checking Accounting sign-in…</p><p>Historical records use the assigned accounting month. Each journal month is restored and checked separately. October stays closed.</p>
<button type="button" id="history" disabled>Save historical reconciliations</button><button type="button" id="journals" disabled>Restore journal months</button><button type="button" id="chart" disabled>Restore chart and rent schedules</button><ol id="result" aria-live="polite"></ol><a href="desktop.html">Open Accounting</a></main>
<script>
const db=window.supabase.createClient(window.OJM_SUPABASE_URL,window.OJM_SUPABASE_ANON_KEY);
const buttons=Array.from(document.querySelectorAll('button'));const status=document.getElementById('session');
function enable(allowed){for(const b of buttons)b.disabled=!allowed;}
async function run(phases){enable(false);try{for(const phase of phases){status.textContent='Checking '+phase+'…';const response=await db.rpc('apply_friday_recovery_20261116',{p_phase:phase});if(response.error)throw response.error;let result=response.data;const row=document.createElement('li');row.textContent=phase+' — '+(result.alreadyComplete?'previously completed':result.restoredJournals?result.restoredJournals+' journals restored':result.historicalAndSeptemberReports!=null?result.historicalAndSeptemberReports+' reconciliation records saved':'chart and schedules checked');document.getElementById('result').append(row);}status.textContent='Selected phase complete.';}catch(e){status.textContent='Stopped. '+(e.message||String(e));}finally{enable(true);}}
document.getElementById('history').onclick=()=>run(['history']);
document.getElementById('journals').onclick=()=>run(Array.from({length:11},(_,i)=>'2026-'+String(i+1).padStart(2,'0')));
document.getElementById('chart').onclick=()=>run(['configuration']);
db.auth.getUser().then(({data,error})=>{if(error||!data.user){status.textContent='Sign in to Oon Jai Accounting, then return to this page.';return;}status.textContent='Signed in to Accounting.';enable(true);}).catch(()=>{status.textContent='Accounting sign-in could not be checked.';});
</script></body></html>
