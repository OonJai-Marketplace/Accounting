<h1>Review journal entry</h1><p role="status" id="msg">Opening Accounting…</p><section id="input" hidden><label>Prepared LAK journal<textarea id="draft" autocomplete="off" spellcheck="false"></textarea></label><button id="review">Preview journal</button></section><section id="preview" hidden><h2 id="date"></h2><p id="memo"></p><table><thead><tr><th>Account</th><th>Line memo</th><th>Debit (LAK)</th><th>Credit (LAK)</th></tr></thead><tbody></tbody></table><button id="post">Post reviewed entry</button></section><p><a href="index.html">Open Accounting</a></p>
<script>
(async()=>{const el=id=>document.getElementById(id),show=s=>el('msg').textContent=s;let db,user,prepared,locked=false;const clear=()=>{prepared=null;el('preview').hidden=true};const ok=x=>{if(x.error)throw Error(x.error.message);return x.data};
try{await deviceVault14334.ready;db=supabase.createClient(OJM_SUPABASE_URL,OJM_SUPABASE_ANON_KEY,{auth:{autoRefreshToken:false,detectSessionInUrl:false}});await deviceVault14334.attach(db);user=ok(await db.auth.getUser()).user;if(!user||!deviceVault14334.unlocked||deviceVault14334.actor!==user.id)throw Error('Sign in to Accounting in this tab first.');el('input').hidden=false;show('Ready for review.')}catch(e){show(e.message);return}
el('draft').oninput=clear;
el('review').onclick=async()=>{if(locked)return;locked=true;clear();try{const d=JSON.parse(el('draft').value);if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||!d.memo||!Array.isArray(d.lines)||d.lines.length<2)throw Error('Check journal date, memo, and lines.');const settings=ok(await db.from('accounting_id_settings').select('journal_prefix,journal_digits').eq('id',true).single());const accounts=ok(await db.from('accounts').select('id,code,name,currency_code,is_posting').in('code',[...new Set(d.lines.map(l=>l.code))]));const lines=d.lines.map(l=>{const a=accounts.find(a=>a.code===l.code&&a.currency_code==='LAK'&&a.is_posting);if(!a||!l.memo||![l.dr,l.cr].every(v=>Number.isFinite(v)&&v>=0)||(!l.dr===!l.cr))throw Error('Invalid LAK journal line.');return {line_date:d.date,account_id:a.id,description:l.memo,currency_code:'LAK',debit:l.dr,credit:l.cr,fx_rate_lak:1,book_rate_lak:null}});
if(lines.reduce((sum,l)=>sum+Math.round(l.debit*100)-Math.round(l.credit*100),0)!==0)throw Error('Debits and credits differ.');const payload={p_transaction_date:d.date,p_memo:d.memo,p_lines:lines,p_prefix:settings.journal_prefix,p_digits:settings.journal_digits};const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(payload)));payload.p_request_key='review-'+[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');const body=document.querySelector('tbody');body.replaceChildren();for(const l of lines){const a=accounts.find(a=>a.id===l.account_id),row=body.insertRow();for(const v of [a.code+' '+a.name,l.description,l.debit?l.debit.toLocaleString('en-US'):'—',l.credit?l.credit.toLocaleString('en-US'):'—'])row.insertCell().textContent=v}el('date').textContent=d.date;el('memo').textContent=d.memo;el('preview').hidden=false;prepared=payload;show('Review the posting date, accounts and amounts.')}catch(e){show(e.message)}finally{locked=false}};
el('post').onclick=async()=>{if(locked||!prepared)return;locked=true;el('post').disabled=true;el('draft').disabled=true;try{if(!navigator.onLine||deviceVault14334.actor!==user.id)throw Error('Reconnect and verify the Accounting session.');show('Waiting for the database receipt…');const rows=ok(await db.rpc('post_manual_journal14228',prepared));if(!rows?.[0]?.entry_no)throw Error('Check the ledger for a receipt.');show('Posted · '+rows[0].entry_no);el('post').hidden=true;el('input').hidden=true;prepared=null}catch(e){show(e.message);el('post').disabled=false;el('draft').disabled=false}finally{locked=false}};
})()</script></html>
