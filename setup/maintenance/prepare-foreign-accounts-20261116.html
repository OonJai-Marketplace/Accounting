<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Phase 2 · Oon Jai Accounting</title>
<style>body{max-width:44rem;margin:4rem auto;padding:0 1.25rem;color:#123d32;font:1rem/1.5 system-ui;background:#faf8f2}button{padding:.7rem 1rem;color:white;background:#09543f;border:0;border-radius:.4rem;font:inherit}button:disabled{opacity:.5}</style>
<script src="../../deployment-config.js"></script><script src="../../scripts/supabase-config.js"></script><script src="../../assets/vendor/supabase.js"></script></head>
<body><main><h1>Prepare foreign-currency accounts</h1><p>Activate the reviewed regular posting accounts and match their branch groups to their LAK accounts.</p><p role="status" id="status">Checking the Accounting administrator session…</p><button id="apply" type="button" disabled>Prepare 21 accounts</button></main>
<script>
'use strict';
const spec=[["1314","1300","USD","ASSET","Prepaid Company House Rent — USD"],["4020","4000","USD","REVENUE","Sales – Dine-in — USD"],["4021","4000","THB","REVENUE","Sales – Dine-in — THB"],["4111","4100","USD","REVENUE","Donations & External Support — USD"],["4112","4100","THB","REVENUE","Donations & External Support — THB"],["4121","4100","USD","REVENUE","House Contribution Income — USD"],["4131","4100","USD","REVENUE","Other Income — USD"],["4132","4100","THB","REVENUE","Other Income — THB"],["5011","5000","USD","EXPENSE","Food Cost / Cost of Goods Sold — USD"],["5012","5000","THB","EXPENSE","Food Cost / Cost of Goods Sold — THB"],["5121","5100","USD","EXPENSE","Kitchen Supplies — USD"],["5122","5100","THB","EXPENSE","Kitchen Supplies — THB"],["5123","5100","THB","EXPENSE","Restaurant Rent — THB"],["5124","5100","USD","EXPENSE","Other Operating Expenses — USD"],["5316","5300","USD","EXPENSE","Salaries — USD"],["5317","5300","THB","EXPENSE","Salaries — THB"],["5320","5300","USD","EXPENSE","Employee Benefits — USD"],["5321","5300","THB","EXPENSE","Employee Benefits — THB"],["5422","5400","USD","EXPENSE","Bank Fees — USD"],["5423","5400","THB","EXPENSE","Bank Fees — THB"],["5424","5400","USD","EXPENSE","Company House Rent — USD"]];
const db=window.supabase.createClient(window.OJM_SUPABASE_URL,window.OJM_SUPABASE_ANON_KEY);
const statusText=document.getElementById('status'), button=document.getElementById('apply');
const codes=spec.map(r=>r[0]);
async function data(query){const r=await query;if(r.error)throw Error(r.error.message);return r.data}
async function admin(){if(!(await data(db.rpc('is_admin'))))throw Error('An active Oon Jai Accounting administrator session is required.');}
async function check(){
 const [accounts,children]=await Promise.all([
 data(db.from('accounts').select('id,code,name,parent_code,account_type,currency_code,account_purpose,is_posting,is_active,is_technical').in('code',codes)),
 data(db.from('sub_accounts').select('id,posting_account_id14285,code,name,currency_code,is_active').in('code',codes))]);
 if(accounts.length!==spec.length||children.length!==spec.length)throw Error('The reviewed accounts could not all be verified.');
 return spec.map(([code,parent,ccy,type,name])=>{
  const a=accounts.find(x=>x.code===code),s=children.find(x=>x.code===code);
  if(!a||!s||s.posting_account_id14285!==a.id||a.name!==name||s.name!==name||a.parent_code!==parent||
     a.account_purpose!=='regular'||a.account_type!==type||a.currency_code!==ccy||s.currency_code!==ccy||
     !a.is_posting||a.is_technical||s.is_active!==a.is_active)throw Error('The chart no longer matches the reviewed account '+code+'.');
  return s;
 });
}
(async()=>{try{await admin();const children=await check();statusText.textContent=children.filter(s=>s.is_active).length+' of 21 accounts active.';button.disabled=false}
catch(err){statusText.textContent=err.message}})();
button.addEventListener('click',async()=>{
 button.disabled=true;statusText.textContent='Preparing the accounts…';
 try{await admin();const children=await check();const ids=children.filter(s=>!s.is_active).map(s=>s.id);
 if(ids.length)await data(db.from('sub_accounts').update({is_active:true}).in('id',ids).eq('is_active',false));
 if((await check()).some(s=>!s.is_active))throw Error('Some accounts are still inactive.');
 await data(db.rpc('prepare_foreign_chart_2026'));
 statusText.textContent='Phase 2 complete. All 21 accounts are active and their branch groups have been prepared.';
 }catch(err){statusText.textContent=err.message;button.disabled=false}
});
</script></body></html>
