<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>January–April foreign journals · Oon Jai Accounting</title><style>body{font:16px system-ui;max-width:52rem;margin:4rem auto;padding:1rem;color:#173c32}button{font:inherit;margin:.3rem .5rem .3rem 0;padding:.55rem .9rem}pre{white-space:pre-wrap}a{color:#176453}</style></head>
<body><main><h1>January–April foreign journals</h1><p>Apply the reviewed salary, rent and donation transfers to the selected closed month. Each month retains its journal IDs and saved rates.</p><div id="months"></div><pre id="result" role="status">Checking access…</pre><p><a href="../../desktop.html">Open Accounting</a></p></main>
<script src="../../deployment-config.js"></script><script src="../../scripts/supabase-config.js"></script><script src="../../assets/vendor/noble-gcm14334.js"></script><script src="../../scripts/device-vault14334.js"></script><script src="../../assets/vendor/supabase.js"></script><script>
(async()=>{
 const result=document.querySelector('#result'),months=document.querySelector('#months');
 try{
   const db=window.supabase.createClient(window.OJM_SUPABASE_URL,window.OJM_SUPABASE_ANON_KEY);
   await window.deviceVault14334.attach(db);
   const {data,error}=await db.auth.getUser();
   if(error||!data?.user){result.textContent='Sign in to Accounting, then return to this page.';return;}
   result.textContent='Select a month.';
   for(const [i,label] of ['January','February','March','April'].entries()){
     const button=document.createElement('button');button.textContent='Apply '+label;
     button.onclick=async()=>{
       for(const b of months.children)b.disabled=true;
       result.textContent='Checking '+label+'…';
       try{
         const {data,error}=await db.rpc('phase3_direct_month_2026',{p_month:'2026-0'+(i+1)+'-01'});
         result.textContent=label+' — '+(error?error.message:JSON.stringify(data,null,2));
       }catch(error){result.textContent=error.message;}
       finally{for(const b of months.children)b.disabled=false;}
     };months.append(button);
   }
 }catch(error){result.textContent=error.message;}
})();
</script></body></html>
