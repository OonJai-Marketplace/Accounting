<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>January–April foreign journals · Oon Jai Accounting</title><style>body{font:16px system-ui;max-width:52rem;margin:4rem auto;padding:1rem;color:#173c32}button{font:inherit;margin:.3rem .5rem .3rem 0;padding:.55rem .9rem}pre{white-space:pre-wrap}a{color:#176453}table{border-collapse:collapse;width:100%;margin:1rem 0}th,td{text-align:left;padding:.6rem;border-bottom:1px solid #cbd6d0}th{background:#eaf2ed}details{margin:.55rem 0}summary{cursor:pointer}li{margin:.6rem 0}#output{margin:1.3rem 0}</style></head>
<body><main><h1>January–April foreign journals</h1><p>Review the salary, rent, donation and USD bank-fee transfers for each closed month. Fee lines use the published BCEL EFT rate for each charge. The original journal IDs stay with the entries.</p><div id="months"></div><div id="review"></div><pre id="result" role="status">Checking access…</pre><section id="output"></section><p><a href="../../desktop.html">Open Accounting</a></p></main>
<script src="../../deployment-config.js"></script><script src="../../scripts/supabase-config.js"></script><script src="../../assets/vendor/noble-gcm14334.js"></script><script src="../../scripts/device-vault14334.js"></script><script src="../../assets/vendor/supabase.js"></script><script>
(async()=>{
 const result=document.querySelector('#result'),months=document.querySelector('#months');
 try{
   const db=window.supabase.createClient(window.OJM_SUPABASE_URL,window.OJM_SUPABASE_ANON_KEY);
   await window.deviceVault14334.attach(db);
   const {data,error}=await db.auth.getUser();
   if(error||!data?.user){result.textContent='Sign in to Accounting, then return to this page.';return;}
   result.textContent='Select a month.';
   const review=document.createElement('button');
   review.textContent='Review all four months';
   document.querySelector('#review').append(review);
   review.onclick=async()=>{
     review.disabled=true;
     const all=[];
     try {
       for(const [i,name] of ['January','February','March','April'].entries()){
         const {data,error}=await db.rpc('maintenance_preflight14324',{p_month:'2026-0'+(i+1)+'-01'});
         if(error)throw error;
         const issues=(data.issues||[]).map(v=>({level:v.severity,area:v.title,detail:v.detail,
           saved:!!data.decisions319?.[v.id]?.saved?.reason}));
         all.push({month:name,reconciliationComplete:data.reconciliation305?.complete,issues});
       }
       const out=document.querySelector('#output');out.replaceChildren();
       const table=document.createElement('table'),hdr=table.createTHead().insertRow();
       for(const title of ['Closed month','Cash and bank reconciliation','Blocking findings','Warnings without a saved reason']){
         const th=document.createElement('th');th.textContent=title;hdr.append(th);
       }
       const body=table.createTBody();out.append(table);
       for(const m of all){
         const row=body.insertRow();
         for(const value of [m.month,m.reconciliationComplete?'Complete':'Incomplete',m.issues.filter(v=>v.level==='block').length,
           m.issues.filter(v=>v.level==='warning'&&!v.saved).length]) row.insertCell().textContent=value;
         const panel=document.createElement('details'),summary=document.createElement('summary'),items=document.createElement('ul');
         summary.textContent=m.month+' findings';
         for(const issue of m.issues){
           const li=document.createElement('li');li.textContent=issue.area+' — '+issue.detail;items.append(li);
         }
         panel.append(summary,items);out.append(panel);
       }
       result.textContent='Existing close review • January–April 2026';
     }catch(error){result.textContent=error.message;}
     finally{review.disabled=false;}
   };
   const categorySection=document.createElement('section');
   const heading=document.createElement('h2');heading.textContent='Sales and equity transfers';
   categorySection.append(heading);
   for(const [i,month] of ['January','February','March','April'].entries()){
     const button=document.createElement('button');button.textContent='Post '+month+' sales and equity';
     button.onclick=async()=>{
       const buttons=[...document.querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);
       result.textContent='Checking '+month+' sales and equity…';
       try{
         const {data,error}=await db.rpc('post_category_transfers26',{p_month:'2026-0'+(i+1)+'-01'});
         if(error)throw error;
         result.textContent=month+' sales and equity posted: '+data.posted.join(', ');
       }catch(error){result.textContent=month+' — '+error.message;}
       finally{buttons.forEach(b=>b.disabled=false);}
     };
     categorySection.append(button);
   }
   months.after(categorySection);
   const laterMonths=document.createElement('section');
   const laterTitle=document.createElement('h2');
   laterTitle.textContent='May–October foreign journals';
   laterMonths.append(laterTitle);
   for(const [offset,name] of ['May','June','July','August','September','October'].entries()){
     const period='2026-'+String(offset+5).padStart(2,'0')+'-01';
     const button=document.createElement('button');
     button.textContent='Post '+name+' reviewed journals';
     button.onclick=async()=>{
       const buttons=Array.from(document.querySelectorAll('button'));
       buttons.forEach(control=>control.disabled=true);
       result.textContent='Checking '+name+' against the reviewed entries…';
       try{
         const {data,error}=await db.rpc('post_category_transfers26',{p_month:period});
         if(error)throw error;
         result.textContent=data.requiresReview
           ?name+' requires review of '+data.requiresReview+' close findings. No journals were posted.'
           :name+' posted: '+data.posted.join(', ');
       }catch(error){result.textContent=name+' — '+error.message;}
       finally{buttons.forEach(control=>control.disabled=false);}
     };
     laterMonths.append(button);
   }
   categorySection.after(laterMonths);
   for(const [i,label] of ['January','February','March','April'].entries()){
     const group=document.createElement('div');months.append(group);
     for(const commit of [false,true]){
       const button=document.createElement('button');button.textContent=(commit?'Post ':'Stage ')+label;
       button.onclick=async()=>{
         for(const b of months.querySelectorAll('button'))b.disabled=true;
         result.textContent='Checking '+label+'…';
         try{
           const {data,error}=await db.rpc('bcel_pilot_month_2026',{p_month:'2026-0'+(i+1)+'-01',p_commit:commit});
           if(error) result.textContent=label+' — '+error.message;
           else if(data.requiresReview) result.textContent=label+' staged for review. '+data.requiresReview.map(x=>x.title+' — '+x.detail).join('\n');
           else result.textContent=label+(data.posted?' posted: ':' staged: ')+(data.journals||data.staged||[]).join(', ');
         }catch(error){result.textContent=error.message;}
         finally{for(const b of months.querySelectorAll('button'))b.disabled=false;}
       };group.append(button);
     }
   }
 }catch(error){result.textContent=error.message;}
})();
</script></body></html>
