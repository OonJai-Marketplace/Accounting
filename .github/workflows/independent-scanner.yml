name: Independent scanner packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/independent-scanner/**'
      - '.github/workflows/independent-scanner.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/independent-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/independent-scanner/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run native:android
      - name: Compile Android test package
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Scan-Android-device-test
          path: apps/independent-scanner/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  ios:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/independent-scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/independent-scanner/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run native:ios
      - name: Compile unsigned iPhone archive
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -destination 'generic/platform=iOS' -archivePath build/PocketScan.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - uses: actions/upload-artifact@v4
        with:
          name: Pocket-Scan-iPhone-unsigned-archive
          path: apps/independent-scanner/build/PocketScan.xcarchive
          if-no-files-found: error
