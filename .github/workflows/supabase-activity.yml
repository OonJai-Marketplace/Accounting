name: Accounting health check

on:
  schedule:
    # One small health request per hour, outside the app. Workflow failures are visible in GitHub Actions.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check isolated database response
        run: |
          curl --fail --silent --show-error --retry 2 --retry-delay 5 --max-time 20 \
            --header 'Cache-Control: no-cache' \
            --output /dev/null \
            'https://nhjsesfhapnjtwlxvirm.supabase.co/functions/v1/keepalive-ping'
