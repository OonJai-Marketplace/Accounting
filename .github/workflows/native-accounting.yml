name: Connected Accounting native builds
on:
  workflow_dispatch:
  push:
    branches: [feat/connected-native-scanner, feat/scanner-setup215]
    paths: ['mobile/connected-accounting/**', '.github/workflows/native-accounting.yml', 'src/documents/scanner/**', 'src/subusers/phone/**']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '21'}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: python tools/build-modules.py --check
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile/connected-accounting
      - run: npm run build && npx cap add android && npm run prepare:native
        working-directory: mobile/connected-accounting
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: oonjai-connected-accounting-test-signing-v1
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: mobile/connected-accounting/android
      - uses: actions/upload-artifact@v4
        with:
          name: OonJai-Accounting-Android-test
          path: mobile/connected-accounting/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
  ios-compile:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: mobile/connected-accounting
      - run: npm run build && npx cap add ios && npm run prepare:native
        working-directory: mobile/connected-accounting
      - run: xcodebuild -project App/App.xcodeproj -scheme App -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/connected-accounting/ios
