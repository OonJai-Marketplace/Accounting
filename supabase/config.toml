# JWT signing keys are verified by auth.getUser(token) inside the handler.
# This does not make password operations anonymous.
[functions.admin-password14257]
verify_jwt = false

# All three handlers verify the Auth token and enforce server-side authorization.
[functions.admin-create-user]
verify_jwt = false
[functions.recovery-vault113]
verify_jwt = false

# Public probe returns only a constant and calls the anonymous grant.
[functions.keepalive-ping]
verify_jwt = false

# Authenticated bridge/start; callback verifies a one-use expiring OAuth state.
[functions.google-journal-bridge]
verify_jwt = false
[functions.google-oauth-start]
verify_jwt = false
[functions.google-oauth-callback]
verify_jwt = false
