<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head><body><div class="app">
  <header class="top"><div class="brand">Oon Jai<small>My workspace</small></div><div class="top-actions"><button id="connection" class="connection" type="button">Starting…</button><button id="avatar" class="avatar" type="button" aria-label="Account" aria-expanded="false" hidden></button></div></header>
  <div id="accountMenu" class="account-menu" hidden><strong id="accountName"></strong><button type="button" data-action="refresh">Refresh records</button><button type="button" data-action="print">Print report</button><button type="button" data-action="signout">Sign out</button></div>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>

  <main id="workspace" class="screen"><h1>Opening your workspace…</h1><p>Your saved records will appear here.</p></main>
  <nav id="bottom" class="bottom" aria-label="Workspace navigation" hidden>
    <button type="button" data-page="home"><span data-icon="home"></span>Home</button>
    <button type="button" data-page="accounts"><span data-icon="wallet"></span>Accounts</button>
    <button type="button" data-page="post"><span data-icon="plus"></span>Post</button>
    <button type="button" data-page="entries"><span data-icon="book"></span>Entries</button>
    <button type="button" data-page="totals"><span data-icon="chart"></span>Totals</button>
  </nav>
</div><dialog id="dialog"><form method="dialog"><div id="dialogBody"></div><div id="dialogButtons" class="actions"></div></form></dialog></body></html>
